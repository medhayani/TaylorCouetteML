# Architecture sizes of the two reinforcement-learning refiners.
# Read by train/train_sarl_v2.py and train/train_marl_v2.py.

# ---------- SARL_PRO (PyTorch SAC, scaled up) ----------
sarl_pro:
  feature_extractor:
    seq_hidden: 256       # was 128
    seq_out: 384          # was 192
    static_hidden: 256
    fusion_hidden: 512    # was 256
    num_attn_heads: 8
    use_attention_pooling: true
    dropout: 0.05
  actor_layers: [512, 512, 256]    # was [256, 256]
  critic_layers: [512, 512, 256]
  sac:
    learning_rate: 4.0e-5
    buffer_size: 360000   # was 180000
    learning_starts: 12000
    batch_size: 512       # was 256
    tau: 0.005
    gamma: 0.99
    train_freq: 2
    gradient_steps: 4     # was 2
    ent_coef: "auto_0.1"
  timesteps: 1500000      # was 800k
  n_envs: 8
  expected_params: "~30M"

# ---------- MARL_PRO (3 agents PyTorch SAC, scaled up + cross-agent attention) ----------
marl_pro:
  num_agents: 3           # localizer, shape, geometry
  agent_features:
    seq_hidden: 256
    static_hidden: 256
    fusion_hidden: 512
    num_attn_heads: 8
  actor_layers:  [768, 768, 384]
  critic_layers: [768, 768, 384]
  cross_agent_attention:
    enabled: true
    num_rounds: 3
    num_heads: 8
  sac:
    learning_rate: 5e-5
    buffer_size: 360000
    learning_starts: 10000
    batch_size: 512
    gamma: 0.99
    tau: 0.005
    ent_coef: "auto_0.1"
  timesteps_per_agent:
    localizer: 500000     # was 250k
    shape:     700000     # was 350k
    geometry:  900000     # was 450k
  obs_clip: 5.0
  reward_clip: 12.0
  hard_sampling: true
  expected_params: "~70M"
